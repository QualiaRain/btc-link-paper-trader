[project]
name = "paper-trail-backend"
version = "0.1.0"
description = "Python replay, forecast and paper-accounting service for the BTC/LINK paper trader"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx2>=2.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
