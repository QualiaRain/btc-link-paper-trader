# Runs the same checks as `scripts/verify.sh`. Verification only: read-only token, no deployment,
# no secrets, no publishing. GitHub Pages is unaffected by this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (with test dependencies)
        run: python -m pip install -e "backend[dev]"
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium for the browser tests
        run: npx --prefix web playwright-core install --with-deps chromium
      - name: Verify (existing JS tests, parity goldens, backend, contract, TypeScript, end-to-end, browser)
        run: scripts/verify.sh
